<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#367bf0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="0.6" stop-color="#367bf0"/>
      <stop offset="1" stop-color="#ff3b3b"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff41" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typ">
      <rect x="40" y="58" width="100" height="32">
        <animate attributeName="width" values="0;0;100;100;0" keyTimes="0;0.05;0.2;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Courier New', 'DejaVu Sans Mono', Consolas, Menlo, monospace; }
    .rain { font-family: 'Courier New', 'DejaVu Sans Mono', Consolas, monospace; font-size: 15px; fill: #00ff41; opacity: 0.13;
            writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 2px; }
    @keyframes fall  { from { transform: translateY(-300px); } to { transform: translateY(460px); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes sweep { from { transform: translateY(-80px); } to { transform: translateY(460px); } }
    @keyframes role  { 0% { opacity: 0; } 3% { opacity: 1; } 22% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes feed  { 0% { opacity: 0; } 6% { opacity: 1; } 84% { opacity: 1; } 94%, 100% { opacity: 0; } }
    .f1 { animation: fall 9s linear infinite; }
    .f2 { animation: fall 13s linear infinite -4s; }
    .f3 { animation: fall 7s linear infinite -2s; }
    .f4 { animation: fall 15s linear infinite -8s; }
    .f5 { animation: fall 11s linear infinite -6s; }
    .cur  { animation: blink 1s steps(1) infinite; }
    .dot  { animation: pulse 1.2s ease-in-out infinite; }
    .scan { animation: sweep 7s linear infinite; }
    .r1, .r2, .r3, .r4 { opacity: 0; animation: role 12s linear infinite backwards; }
    .r1 { opacity: 1; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    .r4 { animation-delay: 9s; }
    .l1, .l2, .l3, .l4, .l5 { opacity: 1; animation: feed 11s ease-in-out infinite backwards; }
    .l2 { animation-delay: 1.2s; }
    .l3 { animation-delay: 2.4s; }
    .l4 { animation-delay: 3.6s; }
    .l5 { animation-delay: 4.8s; }
  </style>

  <!-- background -->
  <rect width="1000" height="440" fill="url(#bg)"/>
  <rect width="1000" height="440" fill="url(#grid)"/>

  <!-- matrix rain -->
  <text class="rain f1" x="30"  y="40">10110A3F0C91E7</text>
  <text class="rain f2" x="110" y="40">0F1A0B7E3D2C95</text>
  <text class="rain f3" x="200" y="40">E7A10C3B91F0D2</text>
  <text class="rain f4" x="300" y="40">01B7C3A9F0E1D4</text>
  <text class="rain f5" x="410" y="40">9D0F1A7E3C0B21</text>
  <text class="rain f1" x="520" y="40">3F0A1E9C7B0D12</text>
  <text class="rain f3" x="620" y="40">B0E1A7F39C0D52</text>
  <text class="rain f2" x="700" y="40">7C0E1B9A3F02D5</text>
  <text class="rain f4" x="920" y="40">A1F03C7E9B0D24</text>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="1000" height="80" fill="url(#scan)"/>

  <!-- terminal title bar -->
  <rect width="1000" height="34" fill="#0d1420"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="17" r="6" fill="#27c93f"/>
  <text class="mono" x="500" y="22" text-anchor="middle" font-size="13" fill="#6b7a90">ziad@soc-lab: ~/profile</text>

  <!-- prompt (typed) -->
  <g clip-path="url(#typ)">
    <text class="mono" x="44" y="84" font-size="18" fill="#00ff41">$ whoami</text>
  </g>
  <text class="mono cur" x="150" y="84" font-size="18" fill="#00ff41">█</text>

  <!-- name -->
  <text class="mono" x="44" y="154" font-size="64" font-weight="bold" letter-spacing="5" fill="url(#name)" filter="url(#glow)">ZIAD AYMAN</text>

  <!-- full name + subtitle -->
  <text class="mono" x="46" y="184" font-size="15" letter-spacing="2" fill="#c9d1d9">Ziad Ayman Mohamed Shokry</text>
  <text class="mono" x="46" y="214" font-size="18" letter-spacing="2" fill="#367bf0">SOC ANALYST IN TRAINING  //  BLUE TEAM</text>

  <!-- rotating focus -->
  <text class="mono" x="46" y="244" font-size="14" fill="#8b9bb0">&gt; focus:</text>
  <g class="mono" font-size="14" font-weight="bold" fill="#00ff41">
    <text class="r1" x="124" y="244">Threat Detection</text>
    <text class="r2" x="124" y="244">Alert Triage</text>
    <text class="r3" x="124" y="244">Incident Response</text>
    <text class="r4" x="124" y="244">Threat Hunting</text>
  </g>

  <!-- info lines -->
  <text class="mono" x="46" y="266" font-size="12" fill="#8b9bb0">&gt; Minya, Egypt  |  B.Sc. Computer Science, Minya National University (2028)</text>
  <text class="mono" x="46" y="282" font-size="12" fill="#8b9bb0">&gt; Splunk · Wireshark · Nmap · VirusTotal · CyberChef · MITRE ATT&amp;CK</text>

  <!-- shield + pulse -->
  <circle cx="830" cy="130" r="50" fill="none" stroke="#367bf0" stroke-width="2">
    <animate attributeName="r" values="50;95" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#glow)" transform="translate(-70,-28)">
    <path d="M900 60 L960 82 V140 C960 178 930 200 900 212 C870 200 840 178 840 140 V82 Z" fill="#0b1830" stroke="#367bf0" stroke-width="4"/>
    <path d="M872 138 L893 160 L930 114" fill="none" stroke="#00ff41" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle class="dot" cx="712" cy="218" r="4" fill="#00ff41"/>
  <text class="mono" x="724" y="222" font-size="13" font-weight="bold" fill="#00ff41">OPEN TO SOC INTERNSHIPS</text>
  <text class="mono" x="706" y="242" font-size="12" fill="#8b9bb0">THM <tspan fill="#ff3b3b">TOP 1%</tspan>  |  FORTINET <tspan fill="#00ff41">NSE 3</tspan></text>
  <text class="mono" x="706" y="260" font-size="12" fill="#8b9bb0">CISCO <tspan fill="#367bf0">CYBER DEFENSE ANALYST</tspan></text>

  <!-- PERFORMANCE PANEL -->
  <rect x="44" y="296" width="430" height="128" rx="6" fill="#0a0f18" fill-opacity="0.92" stroke="#1b2a3f"/>
  <text class="mono" x="58" y="316" font-size="12" letter-spacing="2" fill="#367bf0">PERFORMANCE // SOC SIMULATOR</text>

  <text class="mono" x="58" y="338" font-size="12" fill="#c9d1d9">TRUE POSITIVE</text>
  <rect x="180" y="328" width="210" height="11" rx="2" fill="#12202e"/>
  <rect x="180" y="328" width="210" height="11" rx="2" fill="#00ff41">
    <animate attributeName="width" values="0;210;210;0" keyTimes="0;0.2;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="mono" x="400" y="338" font-size="12" font-weight="bold" fill="#00ff41">100%</text>

  <text class="mono" x="58" y="360" font-size="12" fill="#c9d1d9">MY MTTR</text>
  <rect x="180" y="350" width="210" height="11" rx="2" fill="#12202e"/>
  <rect x="180" y="350" width="52" height="11" rx="2" fill="#00ff41">
    <animate attributeName="width" values="0;52;52;0" keyTimes="0;0.2;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="mono" x="400" y="360" font-size="12" font-weight="bold" fill="#00ff41">1 MIN</text>

  <text class="mono" x="58" y="382" font-size="12" fill="#c9d1d9">PLATFORM AVG</text>
  <rect x="180" y="372" width="210" height="11" rx="2" fill="#12202e"/>
  <rect x="180" y="372" width="210" height="11" rx="2" fill="#367bf0">
    <animate attributeName="width" values="0;210;210;0" keyTimes="0;0.2;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="mono" x="400" y="382" font-size="12" font-weight="bold" fill="#367bf0">4 MIN</text>

  <text class="mono" x="58" y="410" font-size="11" fill="#8b9bb0"><tspan fill="#00ff41">90</tspan> ALERTS  |  <tspan fill="#00ff41">2,300+</tspan> PROBLEMS  |  <tspan fill="#00ff41">10+</tspan> CERTS  |  BANDIT <tspan fill="#00ff41">34/34</tspan></text>

  <!-- ALERT FEED PANEL -->
  <rect x="494" y="296" width="462" height="128" rx="6" fill="#0a0f18" fill-opacity="0.92" stroke="#1b2a3f"/>
  <text class="mono" x="508" y="316" font-size="12" letter-spacing="2" fill="#367bf0">SOC SIMULATOR // LIVE ALERT FEED</text>
  <circle class="dot" cx="934" cy="312" r="4" fill="#ff3b3b"/>

  <g class="l1">
    <text class="mono" x="508" y="338" font-size="12"><tspan fill="#ff3b3b">[ALERT]</tspan><tspan fill="#c9d1d9"> Phishing email delivered</tspan></text>
    <text class="mono" x="942" y="338" font-size="12" text-anchor="end" font-weight="bold" fill="#00ff41">TRUE POSITIVE</text>
  </g>
  <g class="l2">
    <text class="mono" x="508" y="357" font-size="12"><tspan fill="#ff3b3b">[ALERT]</tspan><tspan fill="#c9d1d9"> Credential dumping (T1003)</tspan></text>
    <text class="mono" x="942" y="357" font-size="12" text-anchor="end" font-weight="bold" fill="#00ff41">TRUE POSITIVE</text>
  </g>
  <g class="l3">
    <text class="mono" x="508" y="376" font-size="12"><tspan fill="#ff3b3b">[ALERT]</tspan><tspan fill="#c9d1d9"> SYN/FIN port-scan pattern</tspan></text>
    <text class="mono" x="942" y="376" font-size="12" text-anchor="end" font-weight="bold" fill="#00ff41">TRUE POSITIVE</text>
  </g>
  <g class="l4">
    <text class="mono" x="508" y="395" font-size="12"><tspan fill="#ff3b3b">[ALERT]</tspan><tspan fill="#c9d1d9"> Suspicious DNS tunneling</tspan></text>
    <text class="mono" x="942" y="395" font-size="12" text-anchor="end" font-weight="bold" fill="#00ff41">TRUE POSITIVE</text>
  </g>
  <g class="l5">
    <text class="mono" x="508" y="414" font-size="12"><tspan fill="#ff3b3b">[ALERT]</tspan><tspan fill="#c9d1d9"> HTTP credentials exposed</tspan></text>
    <text class="mono" x="942" y="414" font-size="12" text-anchor="end" font-weight="bold" fill="#00ff41">TRUE POSITIVE</text>
  </g>

  <!-- bottom accent bar -->
  <rect y="434" width="1000" height="6" fill="url(#bar)"/>
</svg>
