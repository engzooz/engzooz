<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#367bf0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="0.6" stop-color="#367bf0"/>
      <stop offset="1" stop-color="#ff3b3b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff41" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, Menlo, monospace; }
    .rain { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #00ff41; opacity: 0.16;
            writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 2px; }
    @keyframes fall { from { transform: translateY(-260px); } to { transform: translateY(300px); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .f1 { animation: fall 9s linear infinite; }
    .f2 { animation: fall 12s linear infinite -4s; }
    .f3 { animation: fall 7s linear infinite -2s; }
    .f4 { animation: fall 14s linear infinite -8s; }
    .f5 { animation: fall 10s linear infinite -6s; }
    .cur { animation: blink 1s steps(1) infinite; }
    .dot { animation: pulse 1.4s ease-in-out infinite; }
  </style>

  <!-- background -->
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- matrix rain -->
  <text class="rain f1" x="60"  y="40">10110A3F0C91E7</text>
  <text class="rain f2" x="150" y="40">0F1A0B7E3D2C95</text>
  <text class="rain f3" x="250" y="40">E7A10C3B91F0D2</text>
  <text class="rain f4" x="400" y="40">01B7C3A9F0E1D4</text>
  <text class="rain f5" x="560" y="40">9D0F1A7E3C0B21</text>
  <text class="rain f1" x="690" y="40">3F0A1E9C7B0D12</text>
  <text class="rain f3" x="780" y="40">B0E1A7F39C0D52</text>

  <!-- terminal title bar -->
  <rect width="1000" height="34" fill="#0d1420"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="17" r="6" fill="#27c93f"/>
  <text class="mono" x="500" y="22" text-anchor="middle" font-size="13" fill="#6b7a90">ziad@soc-lab: ~</text>

  <!-- prompt -->
  <text class="mono" x="44" y="84" font-size="18" fill="#00ff41">$ whoami<tspan class="cur" fill="#00ff41"> █</tspan></text>

  <!-- name -->
  <text class="mono" x="44" y="158" font-size="70" font-weight="bold" letter-spacing="5" fill="url(#name)" filter="url(#glow)">ZIAD AYMAN</text>

  <!-- subtitle -->
  <text class="mono" x="46" y="198" font-size="20" letter-spacing="3" fill="#367bf0">SOC ANALYST IN TRAINING  //  BLUE TEAM</text>

  <!-- full name -->
  <text class="mono" x="46" y="226" font-size="15" letter-spacing="2" fill="#c9d1d9">Ziad Ayman Mohamed Shokry</text>

  <!-- status line -->
  <circle class="dot" cx="52" cy="254" r="5" fill="#ff3b3b"/>
  <text class="mono" x="68" y="259" font-size="14" fill="#8b9bb0">ALERTS TRIAGED: <tspan fill="#00ff41">90</tspan>   |   TRUE POSITIVE: <tspan fill="#00ff41">100%</tspan>   |   MTTR: <tspan fill="#00ff41">1 MIN</tspan>   |   THM: <tspan fill="#ff3b3b">TOP 1%</tspan></text>

  <!-- shield -->
  <g filter="url(#glow)" transform="translate(0,6)">
    <path d="M900 60 L960 82 V140 C960 178 930 200 900 212 C870 200 840 178 840 140 V82 Z" fill="#0b1830" stroke="#367bf0" stroke-width="4"/>
    <path d="M872 138 L893 160 L930 114" fill="none" stroke="#00ff41" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- bottom accent bar -->
  <rect y="274" width="1000" height="6" fill="url(#bar)"/>
</svg>
